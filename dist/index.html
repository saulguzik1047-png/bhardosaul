<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDV - Sistema</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Metal+Mania&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        /* iOS system colors */
        --ios-bg: #f2f2f7;
        --ios-bg-grouped: #ffffff;
        --ios-blue: #007aff;
        --ios-green: #34c759;
        --ios-red: #ff3b30;
        --ios-orange: #ff9500;
        --ios-yellow: #ffcc00;
        --ios-purple: #af52de;
        --ios-pink: #ff2d55;
        --ios-teal: #5ac8fa;
        --ios-indigo: #5856d6;
        --ios-gray: #8e8e93;
        --ios-gray2: #aeaeb2;
        --ios-gray3: #c7c7cc;
        --ios-gray4: #d1d1d6;
        --ios-gray5: #e5e5ea;
        --ios-gray6: #f2f2f7;
        --ios-separator: rgba(60, 60, 67, 0.12);
        --ios-label: #1c1c1e;
        --ios-label-secondary: #3c3c43;
        --ios-label-tertiary: rgba(60, 60, 67, 0.6);
        --ios-label-quaternary: rgba(60, 60, 67, 0.3);
        --ios-fill: rgba(120, 120, 128, 0.12);
        --ios-fill-secondary: rgba(120, 120, 128, 0.16);
        --ios-glass: rgba(255, 255, 255, 0.72);
        --ios-glass-border: rgba(255, 255, 255, 0.6);
        --ios-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
        --ios-shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
        --ios-shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
        --ios-shadow-float: 0 8px 28px rgba(0, 0, 0, 0.1), 0 2px 8px rgba(0, 0, 0, 0.05);
        --ios-radius-sm: 10px;
        --ios-radius-md: 14px;
        --ios-radius-lg: 18px;
        --ios-radius-xl: 24px;
        --ios-radius-2xl: 28px;
        --ios-transition: 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
        background: var(--ios-bg);
        background-image:
          radial-gradient(ellipse at 0% 0%, rgba(0, 122, 255, 0.04) 0%, transparent 50%),
          radial-gradient(ellipse at 100% 100%, rgba(175, 82, 222, 0.03) 0%, transparent 50%);
        color: var(--ios-label);
        height: 100vh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.2px;
      }

      * {
        box-sizing: border-box;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(60, 60, 67, 0.18);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(60, 60, 67, 0.3);
      }

      /* --- TOPBAR (iOS Navigation Bar) --- */
      .topbar {
        background: var(--ios-glass);
        backdrop-filter: blur(20px) saturate(1.8);
        -webkit-backdrop-filter: blur(20px) saturate(1.8);
        color: var(--ios-label);
        padding: 8px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 56px;
        border-bottom: 0.5px solid var(--ios-separator);
        position: relative;
        z-index: 100;
      }

      .topbar-menu {
        display: flex;
        gap: 4px;
        align-items: center;
        z-index: 2;
        justify-content: flex-start;
      }

      .topbar button {
        background: transparent;
        color: var(--ios-blue);
        border: none;
        padding: 6px 10px;
        border-radius: var(--ios-radius-sm);
        cursor: pointer;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 4px;
        transition: var(--ios-transition);
        font-weight: 500;
      }
      .topbar button:hover,
      .topbar button.active {
        background: rgba(0, 122, 255, 0.1);
        color: var(--ios-blue);
      }
      .topbar button:active {
        background: rgba(0, 122, 255, 0.15);
        transform: scale(0.97);
      }

      .bar-logo {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        font-size: 20px;
        font-weight: 700;
        color: var(--ios-label);
        letter-spacing: -0.5px;
        user-select: none;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1;
        text-transform: none;
        background: none;
        -webkit-text-fill-color: var(--ios-label);
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        z-index: 2;
        color: var(--ios-label-secondary);
      }

      /* --- LOGIN (iOS Card) --- */
      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: calc(100vh - 56px);
        background: var(--ios-bg);
      }
      .login-card {
        background: var(--ios-glass);
        backdrop-filter: blur(24px) saturate(1.8);
        -webkit-backdrop-filter: blur(24px) saturate(1.8);
        padding: 36px 32px;
        border-radius: var(--ios-radius-2xl);
        box-shadow: var(--ios-shadow-lg);
        border: 0.5px solid var(--ios-glass-border);
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      .login-card i.cadeado {
        font-size: 44px;
        color: var(--ios-blue);
        margin-bottom: 16px;
        filter: none;
      }
      .login-card h3 {
        margin: 0 0 8px 0;
        font-size: 20px;
        font-weight: 700;
        color: var(--ios-label);
        letter-spacing: -0.4px;
      }
      .login-card p {
        font-size: 14px;
        color: var(--ios-label-tertiary);
        margin: 0 0 24px 0;
        line-height: 1.4;
      }
      .login-card input,
      .login-card select {
        width: 100%;
        padding: 14px 16px;
        border: none;
        border-radius: var(--ios-radius-md);
        font-size: 16px;
        outline: none;
        margin-bottom: 10px;
        text-align-last: center;
        text-align: center;
        background: var(--ios-fill);
        color: var(--ios-label);
        transition: var(--ios-transition);
      }
      .login-card input:focus,
      .login-card select:focus {
        background: var(--ios-fill-secondary);
        box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.3);
      }
      .login-card select option {
        background: #ffffff;
        color: var(--ios-label);
      }
      .btn-acessar {
        background: var(--ios-blue);
        color: white;
        border: none;
        padding: 14px;
        width: 100%;
        border-radius: var(--ios-radius-md);
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--ios-transition);
        margin-top: 6px;
        letter-spacing: -0.2px;
      }
      .btn-acessar:hover {
        background: #0a84ff;
      }
      .btn-acessar:active {
        transform: scale(0.97);
        background: #0066cc;
      }
      .erro-senha {
        color: var(--ios-red);
        font-size: 14px;
        margin-top: 12px;
        font-weight: 500;
      }

      /* --- LAYOUTS --- */
      .main-container {
        display: grid;
        grid-template-columns: 300px 350px 1fr;
        height: calc(100vh - 56px);
        gap: 12px;
        padding: 12px;
      }
      .single-container {
        height: calc(100vh - 56px);
        padding: 20px;
        overflow-y: auto;
      }
      .grid-financeiro-tabelas {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 16px;
      }
      .col {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow-y: auto;
      }

      h2 {
        font-size: 28px;
        margin: 0 0 16px 0;
        color: var(--ios-label);
        font-weight: 700;
        letter-spacing: -0.6px;
      }
      h3 {
        font-size: 20px;
        margin: 0 0 12px 0;
        color: var(--ios-label);
        font-weight: 600;
        letter-spacing: -0.4px;
      }

      /* --- PDV --- */
      .busca-container {
        position: relative;
        margin-bottom: 12px;
      }
      .search-box {
        width: 100%;
        padding: 11px 14px;
        border: none;
        border-radius: var(--ios-radius-md);
        font-size: 16px;
        outline: none;
        background: var(--ios-fill);
        color: var(--ios-label);
        transition: var(--ios-transition);
      }
      .search-box:focus {
        background: var(--ios-fill-secondary);
        box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
      }
      .search-box::placeholder {
        color: var(--ios-label-tertiary);
      }

      .sugestoes-box {
        position: absolute;
        top: 46px;
        left: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px) saturate(1.5);
        -webkit-backdrop-filter: blur(20px) saturate(1.5);
        border: 0.5px solid var(--ios-gray4);
        border-radius: var(--ios-radius-md);
        max-height: 200px;
        overflow-y: auto;
        z-index: 10;
        box-shadow: var(--ios-shadow-md);
      }
      .sugestao-item {
        padding: 12px 16px;
        cursor: pointer;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 0.5px solid var(--ios-separator);
        color: var(--ios-label);
        transition: background 0.15s ease;
      }
      .sugestao-item:hover {
        background: var(--ios-fill);
      }
      .sugestao-item:last-child {
        border-bottom: none;
      }
      .sugestao-tag {
        font-size: 12px;
        background: rgba(255, 149, 0, 0.12);
        color: var(--ios-orange);
        padding: 3px 8px;
        border-radius: 6px;
        font-weight: 600;
      }
      .sugestao-nova {
        font-size: 12px;
        background: rgba(52, 199, 89, 0.12);
        color: var(--ios-green);
        padding: 3px 8px;
        border-radius: 6px;
        font-weight: 600;
      }
      .sugestao-ativa {
        font-size: 12px;
        background: rgba(0, 122, 255, 0.12);
        color: var(--ios-blue);
        padding: 3px 8px;
        border-radius: 6px;
        font-weight: 600;
      }

      .comanda-card {
        background: var(--ios-bg-grouped);
        border: none;
        border-radius: var(--ios-radius-md);
        padding: 14px 16px;
        margin-bottom: 8px;
        cursor: pointer;
        border-left: 4px solid var(--ios-blue);
        transition: var(--ios-transition);
        box-shadow: var(--ios-shadow-sm);
      }
      .comanda-card:hover {
        box-shadow: var(--ios-shadow-md);
        transform: translateY(-1px);
      }
      .comanda-card.active {
        background: rgba(0, 122, 255, 0.06);
        border-left-color: var(--ios-blue);
        box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2), var(--ios-shadow-sm);
      }
      .comanda-header {
        display: flex;
        justify-content: space-between;
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 16px;
        color: var(--ios-label);
      }
      .comanda-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .badge-aberto {
        background: rgba(52, 199, 89, 0.12);
        color: var(--ios-green);
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        border: none;
      }
      .comanda-total {
        font-weight: 700;
        font-size: 17px;
        color: var(--ios-label);
      }

      .consumo-box {
        background: var(--ios-glass);
        backdrop-filter: blur(20px) saturate(1.6);
        -webkit-backdrop-filter: blur(20px) saturate(1.6);
        border: 0.5px solid var(--ios-glass-border);
        border-radius: var(--ios-radius-lg);
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 100%;
        box-shadow: var(--ios-shadow-md);
      }
      .consumo-header {
        border-bottom: 0.5px solid var(--ios-separator);
        padding-bottom: 12px;
        margin-bottom: 12px;
      }
      .consumo-items {
        flex-grow: 1;
        overflow-y: auto;
      }
      .item-linha {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 0.5px solid var(--ios-separator);
        font-size: 15px;
        color: var(--ios-label);
      }
      .item-linha .item-qtd-nome {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .item-qtd {
        font-weight: 700;
        color: var(--ios-blue);
      }
      .btn-remove-item {
        background: rgba(255, 59, 48, 0.1);
        border: none;
        color: var(--ios-red);
        cursor: pointer;
        padding: 6px 12px;
        font-size: 13px;
        border-radius: var(--ios-radius-sm);
        transition: var(--ios-transition);
      }
      .btn-remove-item:hover {
        background: rgba(255, 59, 48, 0.18);
      }
      .btn-remove-item:active {
        transform: scale(0.95);
      }

      .consumo-resumo {
        border-top: 0.5px solid var(--ios-separator);
        padding-top: 14px;
        margin-top: 14px;
      }
      .linha-total {
        display: flex;
        justify-content: space-between;
        margin-top: 14px;
        margin-bottom: 16px;
        font-size: 28px;
        font-weight: 700;
        color: var(--ios-label);
        letter-spacing: -0.5px;
      }
      .btn-finalizar {
        background: var(--ios-blue);
        color: white;
        border: none;
        padding: 16px;
        width: 100%;
        border-radius: var(--ios-radius-md);
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 8px;
        transition: var(--ios-transition);
        letter-spacing: -0.2px;
      }
      .btn-finalizar:hover {
        background: #0a84ff;
      }
      .btn-finalizar:active {
        transform: scale(0.98);
        background: #0066cc;
      }
      .btn-imprimir {
        background: var(--ios-fill);
        color: var(--ios-label-secondary);
        border: none;
        padding: 12px;
        width: 100%;
        border-radius: var(--ios-radius-md);
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 8px;
        transition: var(--ios-transition);
      }
      .btn-imprimir:hover {
        background: var(--ios-fill-secondary);
      }
      .btn-imprimir:active {
        transform: scale(0.98);
      }

      /* ESTILOS DE MÚLTIPLOS PAGAMENTOS */
      .grid-multi-pagamento {
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--ios-fill);
        border: none;
        border-radius: var(--ios-radius-md);
        padding: 14px;
        margin-bottom: 12px;
      }
      .linha-multi-pagamento {
        display: grid;
        grid-template-columns: 100px 1fr;
        align-items: center;
        gap: 10px;
      }
      .linha-multi-pagamento label {
        font-size: 14px;
        font-weight: 500;
        color: var(--ios-label-secondary);
      }
      .linha-multi-pagamento input {
        padding: 8px 12px;
        border: none;
        border-radius: var(--ios-radius-sm);
        outline: none;
        font-size: 15px;
        font-family: inherit;
        text-align: right;
        background: rgba(255, 255, 255, 0.7);
        color: var(--ios-label);
        transition: var(--ios-transition);
      }
      .linha-multi-pagamento input:focus {
        box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
      }
      .info-saldo-pagamento {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 600;
        padding-top: 6px;
        border-top: 0.5px solid var(--ios-separator);
        margin-top: 4px;
        color: var(--ios-label-secondary);
      }

      .botoes-pagamento {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 5px;
      }
      .btn-pag {
        border: none;
        padding: 14px;
        border-radius: var(--ios-radius-md);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: white;
        width: 100%;
        transition: var(--ios-transition);
        letter-spacing: -0.2px;
      }
      .btn-pag:hover {
        opacity: 0.88;
      }
      .btn-pag:active {
        transform: scale(0.98);
      }
      .btn-dinheiro {
        background: var(--ios-green);
      }
      .btn-pix {
        background: var(--ios-teal);
      }
      .btn-cartao {
        background: var(--ios-blue);
      }
      .btn-creadiario {
        background: var(--ios-orange);
      }
      .btn-mais-pgto {
        background: var(--ios-purple);
      }
      .btn-cancelar-pag {
        background: var(--ios-fill);
        color: var(--ios-label-secondary);
        border: none;
        padding: 10px;
        font-size: 15px;
        border-radius: var(--ios-radius-md);
        cursor: pointer;
        text-align: center;
        margin-top: 5px;
        font-weight: 500;
        width: 100%;
        transition: var(--ios-transition);
      }
      .btn-cancelar-pag:hover {
        background: var(--ios-fill-secondary);
      }
      .btn-cancelar-pag:active {
        transform: scale(0.98);
      }

      /* CARDÁPIO & CATEGORIAS */
      .categorias-container {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .btn-categoria {
        background: var(--ios-fill);
        border: none;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
        cursor: pointer;
        font-weight: 500;
        color: var(--ios-label-secondary);
        transition: var(--ios-transition);
      }
      .btn-categoria:hover {
        background: var(--ios-fill-secondary);
      }
      .btn-categoria:active {
        transform: scale(0.96);
      }
      .btn-categoria.active {
        background: var(--ios-blue);
        color: white;
      }

      .grid-produtos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }
      .card-prod {
        background: var(--ios-bg-grouped);
        border: none;
        border-radius: var(--ios-radius-lg);
        padding: 10px;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        transition: var(--ios-transition);
        box-shadow: var(--ios-shadow-sm);
      }
      .card-prod:hover {
        box-shadow: var(--ios-shadow-float);
        transform: translateY(-2px);
      }
      .card-prod:active {
        transform: scale(0.98);
      }
      .card-prod img {
        width: 100%;
        height: 90px;
        object-fit: cover;
        border-radius: var(--ios-radius-sm);
        margin-bottom: 10px;
      }
      .prod-nome {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 4px;
        line-height: 1.25;
        color: var(--ios-label);
      }
      .prod-preco {
        font-size: 15px;
        font-weight: 700;
        color: var(--ios-label);
      }

      /* AVATARES E IMAGENS */
      .avatar-placeholder {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--ios-gray5);
        color: var(--ios-label-secondary);
        font-size: 13px;
        font-weight: 600;
        margin-right: 10px;
        vertical-align: middle;
        text-transform: uppercase;
        border: none;
      }
      .img-miniatura-tabela {
        width: 44px;
        height: 44px;
        object-fit: cover;
        border-radius: var(--ios-radius-sm);
        border: none;
      }

      /* --- TABELAS (iOS Grouped List) --- */
      .card-panel {
        background: var(--ios-glass);
        backdrop-filter: blur(20px) saturate(1.6);
        -webkit-backdrop-filter: blur(20px) saturate(1.6);
        border: 0.5px solid var(--ios-glass-border);
        border-radius: var(--ios-radius-lg);
        padding: 20px;
        box-shadow: var(--ios-shadow-md);
        margin-bottom: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th,
      td {
        padding: 12px 14px;
        border-bottom: 0.5px solid var(--ios-separator);
        vertical-align: middle;
      }
      th {
        background: transparent;
        font-size: 12px;
        color: var(--ios-label-tertiary);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      td {
        font-size: 15px;
        color: var(--ios-label);
      }
      tr:last-child td {
        border-bottom: none;
      }

      .linha-clicavel {
        cursor: pointer;
        transition: background 0.15s;
      }
      .linha-clicavel:hover {
        background: var(--ios-fill);
      }
      .detalhe-comandas-bloco {
        background: var(--ios-fill);
        border: none;
        border-radius: var(--ios-radius-md);
        padding: 14px 16px;
        margin: 8px 0;
      }
      .caixa-produtos-consumidos {
        background: var(--ios-fill);
        padding: 10px 14px;
        border-radius: var(--ios-radius-sm);
        margin: 5px 0;
        font-size: 14px;
        border-left: 3px solid var(--ios-gray2);
        color: var(--ios-label-secondary);
      }

      /* SEÇÃO FLUXO DE CAIXA + FILTROS DE DATA */
      .layout-financeiro-header {
        display: grid;
        grid-template-columns: 1fr 280px;
        gap: 16px;
        margin-bottom: 20px;
      }
      .painel-filtro-data {
        background: var(--ios-glass);
        backdrop-filter: blur(20px) saturate(1.6);
        -webkit-backdrop-filter: blur(20px) saturate(1.6);
        border: 0.5px solid var(--ios-glass-border);
        border-radius: var(--ios-radius-lg);
        padding: 20px;
        color: var(--ios-label);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: var(--ios-shadow-sm);
      }
      .filtro-data-campos {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
      }
      .filtro-data-campos select {
        background: var(--ios-fill);
        border: none;
        color: var(--ios-label);
        padding: 10px 12px;
        border-radius: var(--ios-radius-sm);
        outline: none;
        font-family: inherit;
        font-size: 15px;
        transition: var(--ios-transition);
      }
      .filtro-data-campos select:focus {
        box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
      }
      .filtro-data-campos select option {
        background: #ffffff;
      }

      /* ESTILO CUSTOMIZADO IMAGEM (DASHBOARD) */
      .img-dashboard-container {
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: var(--ios-glass);
        backdrop-filter: blur(20px) saturate(1.6);
        -webkit-backdrop-filter: blur(20px) saturate(1.6);
        padding: 20px;
        border-radius: var(--ios-radius-lg);
        border: 0.5px solid var(--ios-glass-border);
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        color: var(--ios-label);
        box-shadow: var(--ios-shadow-md);
      }
      .img-dash-row-top {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 14px;
      }
      .img-dash-card {
        background: var(--ios-bg-grouped);
        border-radius: var(--ios-radius-md);
        padding: 18px 14px;
        border: none;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 140px;
        transition: var(--ios-transition);
        box-shadow: var(--ios-shadow-sm);
      }
      .img-dash-card:hover {
        box-shadow: var(--ios-shadow-md);
        transform: translateY(-1px);
      }
      .img-dash-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 4px;
      }
      .img-dash-icon {
        width: 44px;
        height: 44px;
        border-radius: var(--ios-radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: #fff;
      }
      .img-dash-icon.dinheiro {
        background: rgba(52, 199, 89, 0.15);
        color: var(--ios-green);
      }
      .img-dash-icon.pix {
        background: rgba(90, 200, 250, 0.15);
        color: var(--ios-teal);
      }
      .img-dash-icon.cartao {
        background: rgba(175, 82, 222, 0.15);
        color: var(--ios-purple);
      }
      .img-dash-icon.fiado {
        background: rgba(255, 149, 0, 0.15);
        color: var(--ios-orange);
      }
      .img-dash-icon.totalv {
        background: rgba(52, 199, 89, 0.15);
        color: var(--ios-green);
      }
      .img-dash-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--ios-label-tertiary);
        font-weight: 600;
      }
      .img-dash-value {
        font-size: 22px;
        font-weight: 700;
        margin-top: auto;
        padding-bottom: 10px;
        border-bottom: 0.5px solid var(--ios-separator);
        letter-spacing: -0.4px;
      }
      .img-dash-value.dinheiro { color: var(--ios-green); }
      .img-dash-value.pix { color: var(--ios-teal); }
      .img-dash-value.cartao { color: var(--ios-purple); }
      .img-dash-value.fiado { color: var(--ios-orange); }
      .img-dash-value.totalv { color: var(--ios-green); }
      .img-dash-subtext {
        font-size: 13px;
        color: var(--ios-label-tertiary);
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
      }
      .img-dash-row-bottom {
        background: var(--ios-bg-grouped);
        border-radius: var(--ios-radius-md);
        padding: 20px 22px;
        border: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: var(--ios-shadow-sm);
      }
      .img-dash-bottom-item {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .img-dash-bottom-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: #fff;
      }
      .img-dash-bottom-icon.vendas {
        background: rgba(52, 199, 89, 0.15);
        color: var(--ios-green);
      }
      .img-dash-bottom-icon.custo {
        background: rgba(255, 59, 48, 0.15);
        color: var(--ios-red);
      }
      .img-dash-bottom-icon.lucro {
        background: rgba(0, 122, 255, 0.15);
        color: var(--ios-blue);
      }
      .img-dash-bottom-icon.margem {
        background: rgba(52, 199, 89, 0.15);
        color: var(--ios-green);
      }
      .img-dash-operator {
        font-size: 22px;
        color: var(--ios-label-tertiary);
        font-weight: 500;
      }

      /* FORMULÁRIOS */
      .form-fin-bloco {
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: var(--ios-fill);
        padding: 14px 16px;
        border-radius: var(--ios-radius-md);
        border: none;
        margin-bottom: 14px;
      }
      .form-fin-linha {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        flex-wrap: wrap;
      }
      .form-fin-bloco input,
      .form-fin-bloco select {
        padding: 10px 14px;
        border: none;
        border-radius: var(--ios-radius-sm);
        font-family: inherit;
        font-size: 15px;
        outline: none;
        background: rgba(255, 255, 255, 0.7);
        color: var(--ios-label);
        transition: var(--ios-transition);
      }
      .form-fin-bloco input:focus,
      .form-fin-bloco select:focus {
        box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
      }
      .form-fin-bloco select option {
        background: #ffffff;
      }

      .btn-add-fin {
        background: var(--ios-blue);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: var(--ios-radius-sm);
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: var(--ios-transition);
        font-size: 15px;
      }
      .btn-add-fin:hover {
        background: #0a84ff;
      }
      .btn-add-fin:active {
        transform: scale(0.97);
      }
      .badge-saida {
        background: rgba(255, 59, 48, 0.12);
        color: var(--ios-red);
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        border: none;
      }
      .badge-entrada {
        background: rgba(52, 199, 89, 0.12);
        color: var(--ios-green);
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        border: none;
      }

      .status-pago {
        background: rgba(52, 199, 89, 0.12);
        color: var(--ios-green);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        border: none;
      }
      .status-pendente {
        background: rgba(255, 149, 0, 0.12);
        color: var(--ios-orange);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        border: none;
      }

      .input-tabela {
        padding: 8px 12px;
        border: none;
        border-radius: var(--ios-radius-sm);
        font-family: inherit;
        font-size: 14px;
        width: 100%;
        outline: none;
        background: var(--ios-fill);
        color: var(--ios-label);
        transition: var(--ios-transition);
      }
      .input-tabela:focus {
        box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
      }

      /* CRÍTICO: ESTOQUE MÍNIMO ATINGIDO */
      .estoque-critico {
        background: rgba(255, 59, 48, 0.06) !important;
        color: var(--ios-red);
        font-weight: 500;
      }
      .estoque-critico input {
        color: var(--ios-red) !important;
      }

      /* LIMITADORES DE ALTURA COM SCROLL */
      .wrapper-tabela-scroll {
        max-height: 295px;
        overflow-y: auto;
        border: none;
        border-radius: var(--ios-radius-md);
      }

      /* ESTILOS DA SELEÇÃO DE TELAS NA INJEÇÃO GERENCIAL */
      .checkbox-group {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        padding: 10px 0;
      }
      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 15px;
        cursor: pointer;
        color: var(--ios-label);
      }
      .checkbox-item input {
        width: auto;
        margin: 0;
        accent-color: var(--ios-blue);
      }

      /* ESTILOS DA TELA DE ESTOQUE */
      .estoque-dark-container {
        background: var(--ios-bg);
        background-image:
          radial-gradient(ellipse at 30% 10%, rgba(0, 122, 255, 0.03) 0%, transparent 50%),
          radial-gradient(ellipse at 70% 90%, rgba(175, 82, 222, 0.02) 0%, transparent 50%);
        color: var(--ios-label);
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        padding: 20px;
        border-radius: var(--ios-radius-lg);
        display: flex;
        flex-direction: column;
        gap: 16px;
        height: calc(100vh - 56px);
        overflow-y: auto;
      }
      .estoque-dark-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 0.5px solid var(--ios-separator);
        padding-bottom: 14px;
      }
      .estoque-dark-title-box {
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .estoque-dark-icon-badge {
        background: rgba(255, 59, 48, 0.1);
        color: var(--ios-red);
        width: 40px;
        height: 40px;
        border-radius: var(--ios-radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        border: none;
      }
      .estoque-dark-actions {
        display: flex;
        gap: 10px;
      }
      .btn-dark-delete {
        background: rgba(255, 59, 48, 0.08);
        color: var(--ios-red);
        border: none;
        border-radius: var(--ios-radius-sm);
        padding: 10px 18px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        transition: var(--ios-transition);
      }
      .btn-dark-delete:hover {
        background: rgba(255, 59, 48, 0.15);
      }
      .btn-dark-delete:active {
        transform: scale(0.97);
      }
      .btn-dark-save {
        background: var(--ios-red);
        color: white;
        border: none;
        border-radius: var(--ios-radius-sm);
        padding: 10px 22px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        transition: var(--ios-transition);
      }
      .btn-dark-save:hover {
        background: #d70015;
      }
      .btn-dark-save:active {
        transform: scale(0.97);
      }

      .estoque-dark-layout {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 20px;
        align-items: start;
      }

      .estoque-dark-panel-left {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .estoque-dark-section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--ios-label);
        border-left: 3px solid var(--ios-red);
        padding-left: 10px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-bottom: 4px;
      }
      .dark-form-row {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 14px;
      }
      .dark-form-row-three {
        display: grid;
        grid-template-columns: 1fr 1fr 100px;
        gap: 14px;
        align-items: center;
      }
      .dark-form-row-two-btn {
        display: grid;
        grid-template-columns: 1fr 1fr 120px;
        gap: 14px;
        align-items: flex-end;
      }
      .dark-input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .dark-input-group label {
        font-size: 13px;
        color: var(--ios-label-tertiary);
        font-weight: 500;
      }
      .dark-input-field {
        background: var(--ios-fill);
        border: none;
        color: var(--ios-label);
        padding: 12px 14px;
        border-radius: var(--ios-radius-sm);
        font-size: 15px;
        outline: none;
        width: 100%;
        transition: var(--ios-transition);
      }
      .dark-input-field:focus {
        box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
      }
      .dark-profit-badge {
        background: rgba(52, 199, 89, 0.1);
        color: var(--ios-green);
        padding: 10px;
        border-radius: var(--ios-radius-sm);
        font-weight: 700;
        text-align: center;
        font-size: 15px;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 44px;
      }
      .btn-dark-add-stock {
        background: var(--ios-red);
        color: white;
        border: none;
        padding: 12px;
        border-radius: var(--ios-radius-sm);
        font-weight: 600;
        cursor: pointer;
        height: 44px;
        transition: var(--ios-transition);
        font-size: 15px;
      }
      .btn-dark-add-stock:hover {
        background: #d70015;
      }
      .btn-dark-add-stock:active {
        transform: scale(0.97);
      }

      /* AJUSTE MULTIMÍDIA */
      .dark-media-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 4px;
      }
      .dark-media-preview-box {
        width: 100%;
        height: 90px;
        border-radius: var(--ios-radius-sm);
        overflow: hidden;
        border: none;
        display: flex;
        justify-content: center;
        background: var(--ios-fill);
      }
      .dark-media-preview-box img {
        max-width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .dark-upload-tabs {
        display: flex;
        gap: 2px;
        background: var(--ios-fill);
        padding: 3px;
        border-radius: var(--ios-radius-sm);
        border: none;
        width: fit-content;
      }
      .dark-upload-tab-btn {
        background: transparent;
        border: none;
        color: var(--ios-label-secondary);
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border-radius: 6px;
        transition: var(--ios-transition);
      }
      .dark-upload-tab-btn.active {
        background: var(--ios-bg-grouped);
        color: var(--ios-label);
        box-shadow: var(--ios-shadow-sm);
      }
      .dark-dropzone {
        border: 2px dashed var(--ios-gray4);
        background: var(--ios-fill);
        border-radius: var(--ios-radius-sm);
        padding: 14px;
        text-align: center;
        color: var(--ios-label-tertiary);
        font-size: 13px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        cursor: pointer;
        margin-top: 10px;
        transition: var(--ios-transition);
      }
      .dark-dropzone:hover {
        border-color: var(--ios-blue);
        background: rgba(0, 122, 255, 0.04);
      }
      .dark-search-bar-auto {
        display: flex;
        align-items: center;
        background: var(--ios-fill);
        border: none;
        border-radius: var(--ios-radius-sm);
        padding: 0 8px;
        max-width: 100%;
      }
      .dark-search-bar-auto input {
        background: transparent;
        border: none;
        color: var(--ios-label);
        padding: 8px;
        outline: none;
        width: 100%;
        font-size: 14px;
      }
      .dark-auto-gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .dark-gallery-img {
        height: 40px;
        border-radius: 6px;
        overflow: hidden;
        border: none;
        cursor: pointer;
        transition: var(--ios-transition);
      }
      .dark-gallery-img:hover,
      .dark-gallery-img.active {
        box-shadow: 0 0 0 2px var(--ios-blue);
        transform: scale(1.03);
      }
      .dark-gallery-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .btn-dark-more {
        background: var(--ios-fill);
        border: none;
        border-radius: var(--ios-radius-sm);
        color: var(--ios-label-secondary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        cursor: pointer;
        gap: 4px;
        height: 50px;
        transition: var(--ios-transition);
      }
      .btn-dark-more:hover {
        background: var(--ios-fill-secondary);
      }
      .estoque-dark-panel-right {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      /* AJUSTE CIRÚRGICO DA PRÉ-VISUALIZAÇÃO DO CARDÁPIO COESO */
      .dark-card-preview {
        background: var(--ios-bg-grouped);
        border: none;
        border-radius: var(--ios-radius-md);
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 210px;
        margin: 0 auto;
        box-shadow: var(--ios-shadow-sm);
      }
      .dark-card-preview-img {
        width: 100%;
        height: 85px;
        border-radius: var(--ios-radius-sm);
        object-fit: cover;
      }
      .dark-card-preview-badge {
        background: rgba(255, 59, 48, 0.1);
        color: var(--ios-red);
        font-size: 10px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 4px;
        width: fit-content;
      }
      .dark-card-preview-name {
        font-size: 14px;
        font-weight: 700;
        color: var(--ios-label);
        margin: 1px 0;
      }
      .dark-card-preview-price {
        font-size: 15px;
        font-weight: 700;
        color: var(--ios-label);
      }
      .dark-card-preview-desc {
        font-size: 11px;
        color: var(--ios-label-tertiary);
        line-height: 1.2;
      }

      .dark-quick-info {
        background: var(--ios-bg-grouped);
        border: none;
        border-radius: var(--ios-radius-md);
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-shadow: var(--ios-shadow-sm);
      }
      .dark-quick-info-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--ios-label-tertiary);
        display: flex;
        align-items: center;
        gap: 8px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .dark-quick-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 15px;
        color: var(--ios-label-secondary);
      }
      .dark-quick-row span i {
        margin-right: 8px;
      }
      .dark-quick-val {
        font-weight: 600;
        color: var(--ios-label);
      }
      .dark-quick-val.green {
        color: var(--ios-green);
      }

      /* AJUSTE DA BARRA DE CADASTRO/SELEÇÃO DE PRODUTO */
      .dark-select-product-box {
        background: var(--ios-fill);
        border: none;
        padding: 12px 14px;
        border-radius: var(--ios-radius-sm);
        margin-bottom: 14px;
        max-width: 400px;
      }
      .dark-select-product-box select {
        width: 100%;
        background: transparent;
        border: none;
        color: var(--ios-label);
        font-size: 15px;
        outline: none;
        cursor: pointer;
      }
      .dark-select-product-box select option {
        color: var(--ios-label);
        background-color: #ffffff;
      }

      /* NOVO CONTAINER FLEX PARA COLOCAR OS DOIS BLOCOS DE FINANÇAS LADO A LADO */
      .financeiro-top-row {
        display: flex;
        gap: 16px;
        align-items: stretch;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .financeiro-top-row .card-panel {
        margin-bottom: 0;
        flex: 1;
        min-width: 300px;
      }

      /* SISTEMA DE CAIXAS DE DIÁLOGO PERSONALIZADOS (MODAL) */
      .custom-dialog-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px) saturate(1.2);
        -webkit-backdrop-filter: blur(12px) saturate(1.2);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        animation: overlayFadeIn 0.2s ease;
      }
      @keyframes overlayFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes dialogSlideIn {
        from { opacity: 0; transform: scale(1.05); }
        to { opacity: 1; transform: scale(1); }
      }
      .custom-dialog-box {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(30px) saturate(1.8);
        -webkit-backdrop-filter: blur(30px) saturate(1.8);
        border: 0.5px solid rgba(255, 255, 255, 0.6);
        border-radius: var(--ios-radius-xl);
        padding: 0;
